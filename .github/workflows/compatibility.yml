name: Python and OS compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 builds are unavailable on Ubuntu 26.04.
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up and check repeatability
        run: |
          python setup_env.py
          python setup_env.py
      - name: Exercise documentation dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            .venv/Scripts/python.exe tests/smoke.py
          else
            .venv/bin/python tests/smoke.py
          fi
